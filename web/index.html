<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E121B" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="FineMe, le suivi du patrimoine de votre foyer." />
    <title>FineMe</title>
    <script>
      try {
        var t = localStorage.getItem('fineme.theme');
        var dark = t === 'dark' || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

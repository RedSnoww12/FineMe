# Blueprint Render : API Rust (Docker). La base Postgres est chez Supabase.
services:
  - type: web
    name: fineme-api
    runtime: docker
    rootDir: api
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # chaîne de connexion Supabase (session pooler), à saisir dans Render
      - key: JWT_SECRET
        generateValue: true
      - key: SETUP_TOKEN
        generateValue: true # code demandé à la première configuration, à lire dans Render
      - key: RECOVERY_TOKEN
        generateValue: true # code de secours pour réinitialiser un mot de passe perdu, à lire dans Render
      - key: CRON_SECRET
        generateValue: true # secret de la tâche quotidienne, à recopier dans le secret GitHub CRON_SECRET
      - key: EODHD_API_KEY
        sync: false # optionnel : clé gratuite eodhd.com, fournisseur de cours de repli pour les titres
      - key: CORS_ORIGINS
        sync: false # URL Vercel du front, ex. https://fineme.vercel.app
      - key: MCP_ALLOWED_HOSTS
        sync: false # hôte public de l'API pour le serveur MCP /mcp, ex. fineme-api.onrender.com (défaut : localhost)

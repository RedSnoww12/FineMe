name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (fmt, clippy, tests unitaires + intégration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Les tests d'intégration démarrent Postgres via testcontainers (Docker est présent sur le runner).
      - run: cargo test --workspace

  web:
    name: Web (lint, build, tests unitaires + intégration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [api, web]
    env:
      DATABASE_URL: postgres://fineme:fineme@localhost:5433/fineme
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      CORS_ORIGINS: http://localhost:5173
      PORT: "8080"
      SETUP_TOKEN: ci-code-configuration
      E2E_SETUP_TOKEN: ci-code-configuration
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: docker compose up -d db
      - name: Démarrer l'API
        working-directory: api
        run: |
          cargo build -p fineme-server
          nohup cargo run -p fineme-server > ../api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/api/health && break; sleep 2; done
      - name: Installer le front et Playwright
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Lancer les E2E
        working-directory: web
        run: |
          nohup npm run dev > ../web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:5173 > /dev/null && break; sleep 1; done
          npm run e2e
      - if: failure()
        run: cat api.log web.log || true

name: Mise à jour quotidienne

# Chaque matin : rafraîchit les cours et enregistre l'instantané de patrimoine du jour, même si personne n'ouvre
# l'application. Appelle POST /api/jobs/daily (voir docs/API.md, « Tâche quotidienne »).
#
# À configurer dans Settings > Secrets and variables > Actions du dépôt :
#   - variable FINEME_API_URL : URL Render de l'API, sans /api (ex. https://fineme-api.onrender.com)
#   - secret   CRON_SECRET    : même valeur que la variable CRON_SECRET du service Render
on:
  schedule:
    # 5 h 17 UTC (6 h 17 ou 7 h 17 à Paris) : après la clôture de la veille, avant le début de la journée.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    name: Cours et instantané du jour
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Déclencher la tâche quotidienne
        env:
          API_URL: ${{ vars.FINEME_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Définir la variable FINEME_API_URL et le secret CRON_SECRET du dépôt."
            exit 1
          fi
          # L'offre gratuite de Render met l'API en veille : le premier appel peut attendre son réveil.
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-connrefused --retry-delay 30 --max-time 180 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${API_URL%/}/api/jobs/daily"

[package]
name = "fineme-mcp"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

# Adaptateur entrant MCP (lecture seule) : tools, authentification par jeton d'accès, transport Streamable HTTP.
# Il réutilise les cas d'usage et, pour l'origine de la requête et la forme JSON du contrat, fineme-http.
[dependencies]
fineme-domain = { workspace = true }
fineme-application = { workspace = true }
fineme-http = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
fineme-application = { workspace = true, features = ["test-support"] }
tokio = { workspace = true }
